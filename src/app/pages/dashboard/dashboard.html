<div class="dashboard-page">

  <app-sidebar></app-sidebar>


  <main class="dashboard-main">

    <div class="dashboard-content">

      <section class="welcome-section">

        <h2>
          Bienvenido
        </h2>

        <p>
          Seleccione el grado y la sección para consultar
          la información de las estudiantes.
        </p>

      </section>


      <section class="selection-card">

        <h3>
          Consultar estudiantes
        </h3>


        <div class="selection-fields">

          <div class="form-group">

            <label for="grado">
              Grado
            </label>

            <select
              id="grado"
              [(ngModel)]="grado"
            >

              <option value="">
                Seleccionar grado
              </option>

              <option value="1">
                1.º grado
              </option>

              <option value="2">
                2.º grado
              </option>

              <option value="3">
                3.º grado
              </option>

              <option value="4">
                4.º grado
              </option>

              <option value="5">
                5.º grado
              </option>

              <option value="6">
                6.º grado
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="seccion">
              Sección
            </label>

            <input
  id="seccion"
  type="text"
  placeholder="Ingrese la sección"
  maxlength="10"
  [(ngModel)]="seccion"
  (ngModelChange)="seccion = $event.toUpperCase()"
>

          </div>

        </div>


        <button
          type="button"
          class="students-button"
          (click)="verEstudiantes()"
        >
          Ver estudiantes
        </button>

      </section>


      <section class="summary-section">

        <h3>
          Resumen
        </h3>


        <div class="summary-cards">

          <div class="summary-card">

            <span class="summary-title">
              Estudiantes
            </span>

            <strong>
              --
            </strong>

            <small>
              Total registrado
            </small>

          </div>


          <div class="summary-card">

            <span class="summary-title">
              En riesgo
            </span>

            <strong>
              --
            </strong>

            <small>
              Estudiantes identificadas
            </small>

          </div>


          <div class="summary-card">

            <span class="summary-title">
              Alertas
            </span>

            <strong>
              --
            </strong>

            <small>
              Alertas pendientes
            </small>

          </div>

        </div>

      </section>

    </div>

  </main>

</div>
